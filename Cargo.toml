[package]
name = "atlas-control"
version = "1.0.0"
edition = "2024"
description = "Ultra-fast luxury control center for Press Play ATLAS Gaming Mouse (PAW3311)"

[[bin]]
name = "PressPlayATLAS"
path = "src/main.rs"

[dependencies]
eframe = "0.31"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
