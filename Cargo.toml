[package]
name = "atlas-control"
version = "1.0.0"
edition = "2024"
description = "Ultra-fast luxury control center for Press Play ATLAS Gaming Mouse (PAW3311)"

[[bin]]
name = "PressPlayATLAS"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
